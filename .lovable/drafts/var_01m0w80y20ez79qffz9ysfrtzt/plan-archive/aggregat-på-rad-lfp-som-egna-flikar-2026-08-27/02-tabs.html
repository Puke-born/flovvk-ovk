<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" style="font-family: var(--font-sans)">
  <style>
    .lbl { font-size: 12px; fill: hsl(var(--foreground)); }
    .mut { font-size: 12px; fill: hsl(var(--muted-foreground)); }
    .box { fill: none; stroke: hsl(var(--muted-foreground)); stroke-width: 1; }
    .zone { fill: none; stroke: hsl(var(--border)); stroke-width: 1; stroke-dasharray: 4 3; }
    .fillq { fill: hsl(var(--muted)); }
    .bar { fill: hsl(var(--border)); }
  </style>

  <!-- rad 1: huvudflikar -->
  <rect class="box" x="16" y="20" width="70" height="28" rx="8"/>
  <text class="lbl" x="51" y="38" text-anchor="middle">Intyg</text>

  <rect x="94" y="20" width="70" height="28" rx="8" fill="hsl(var(--accent))" stroke="none"/>
  <text x="129" y="38" text-anchor="middle" style="font-size:12px" fill="hsl(var(--accent-foreground))">LB01</text>

  <rect class="box" x="172" y="20" width="70" height="28" rx="8"/>
  <text class="lbl" x="207" y="38" text-anchor="middle">LB02</text>

  <rect class="box" x="250" y="20" width="34" height="28" rx="8"/>
  <text class="mut" x="267" y="38" text-anchor="middle">+</text>

  <!-- rad 2: bladflikar för valt aggregat -->
  <rect class="box" x="94" y="62" width="76" height="24" rx="8"/>
  <text class="lbl" x="132" y="78" text-anchor="middle">Protokoll</text>

  <rect class="box" x="178" y="62" width="92" height="24" rx="8"/>
  <text class="lbl" x="224" y="78" text-anchor="middle">LFP LB01</text>

  <rect class="box" x="278" y="62" width="106" height="24" rx="8"/>
  <text class="lbl" x="331" y="78" text-anchor="middle">LFP LB01 (2)</text>

  <rect class="box" x="392" y="62" width="60" height="24" rx="8"/>
  <text class="mut" x="422" y="78" text-anchor="middle">+ LFP</text>

  <!-- innehållsyta -->
  <rect class="zone" x="16" y="100" width="608" height="140" rx="8"/>
  <text class="mut" x="28" y="118">innehåll för vald flik</text>
  <rect class="bar" x="28" y="132" width="240" height="8" rx="4"/>
  <rect class="bar" x="28" y="148" width="380" height="8" rx="4"/>
  <rect class="fillq" x="28" y="166" width="584" height="60" rx="6"/>
</svg>
